{{define "title"}}Upload - Static Code Analyzer{{end}}

{{define "content"}}
<div class="row">
    <div class="col-lg-8 mx-auto">
        <h1 class="mb-4">Upload ZIP Archive</h1>
        <p class="lead mb-4">Upload a ZIP file containing multiple source code files for analysis</p>

        <div class="card">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">📦 Upload ZIP Archive</h5>
            </div>
            <div class="card-body">
                <form action="/upload/zip" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="zip_project_name" class="form-label">Project Name</label>
                        <input type="text" class="form-control" id="zip_project_name" name="project_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="zip_file" class="form-label">ZIP File (max 20MB)</label>
                        <input type="file" class="form-control" id="zip_file" name="zip_file" accept=".zip" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Upload ZIP & Analyze</button>
                </form>
            </div>
        </div>

        <div class="mt-4 text-center">
            <p class="text-muted">For single code snippets, use the <a href="/snippet-analyzer">Live Code Analyzer</a> instead.</p>
        </div>
    </div>
</div>
{{end}}
