version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: static_analyzer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: static_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  linters:
    build:
      context: .
      dockerfile: Dockerfile.linters
    container_name: static_analyzer_linters
    volumes:
      - ./storage:/workspace
    command: tail -f /dev/null  # Keep container running
    networks:
      - analyzer_network

networks:
  analyzer_network:
    driver: bridge

volumes:
  postgres_data:

