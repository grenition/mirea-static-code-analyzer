services:
  postgres:
    image: postgres:15
    container_name: static_analyzer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: static_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - analyzer_network

  linters:
    build:
      context: .
      dockerfile: Dockerfile.linters
    container_name: static_analyzer_linters
    volumes:
      - ./storage:/workspace
    command: tail -f /dev/null  # Keep container running
    networks:
      - analyzer_network

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: static_analyzer_webapp
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/static_analyzer?sslmode=disable
      PORT: 8080
    volumes:
      - ./storage:/root/storage
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for docker exec
    depends_on:
      postgres:
        condition: service_healthy
      linters:
        condition: service_started
    networks:
      - analyzer_network

networks:
  analyzer_network:
    driver: bridge

volumes:
  postgres_data:

